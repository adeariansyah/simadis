  <main>
    <section>
      <div class="head">
        <h1>Pengumuman Pendaftaran</h1>
      </div>
      <form action="/daftar_ulang.html" method="post">
        <label for="no_daftar">No. Pendaftaran:</label>
        <input type="number" id="no_daftar" name="no_daftar" placeholder="Masukkan nomor pendaftaran..." required
          min="0" /><br /><br />
        <label for="pin">PIN:</label>
        <input type="text" id="pin" name="pin" placeholder="Masukkan pin pendaftaran..." required /><br /><br />

        <button type="submit">Cek Hasil</button>
      </form>
    </section>
