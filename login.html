<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun - MTs Plus Al-Jawami Cilacap</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #E8F6EE;
            /* Hijau muda sebagai background section/kartu */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(23, 104, 69, 0.08);
        }

        .login-header {
            margin-bottom: 24px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #0F5132;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 14px;
            color: #667085;
            /* Abu-abu teks sekunder */
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #0F5132;
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i {
            position: absolute;
            left: 14px;
            color: #667085;
            font-size: 16px;
        }

        .input-container .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: #667085;
        }

        .input-container input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #D0D5DD;
            border-radius: 8px;
            font-size: 14px;
            color: #101828;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #FFFFFF;
        }

        .input-container input:focus {
            border-color: #176845;
            box-shadow: 0 0 0 3px rgba(23, 104, 69, 0.12);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #667085;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: #176845;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-password {
            color: #176845;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #176845;
            /* Hijau Utama */
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #0F5132;
            /* Hijau Gelap */
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #667085;
        }

        .login-footer a {
            color: #176845;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Masuk Akun</h2>
            <p>Silakan login untuk melanjutkan</p>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" placeholder="Username / ID Pendaftaran" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-regular fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePassword()"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Ingat saya
                </label>
                <a href="#" class="forgot-password">Lupa password?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="login-footer">
            Belum punya akun? <a href="#">Daftar di sini</a>
        </div>
    </div>

    <script>
        // Fungsi interaktif untuk menampilkan/menyembunyikan password
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>

</body>

</html>
